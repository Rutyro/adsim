[workspace]
resolver = "3"
members = ["crates/ams", "crates/server", "bin/adsim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ams = { path = "crates/ams" }
adsim-server = { path = "crates/server" }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time"] }
