[workspace]
resolver = "3"
members = [
    "crates/ams",
    "crates/server",
    "bin/adsim",
    "crates/symbols",
    "crates/axis",
    "crates/plc",
    "crates/client",
    "crates/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ams = { path = "crates/ams" }
adsim-server = { path = "crates/server" }
adsim-symbols = { path = "crates/symbols" }
adsim-axis = { path = "crates/axis" }
adsim-plc = { path = "crates/plc" }
adsim-client = { path = "crates/client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "io-std", "process", "rt-multi-thread", "macros", "time", "sync"] }
